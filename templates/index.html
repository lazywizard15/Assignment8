<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator Demo</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Nicer font */
            background-color: #f4f4f4; /* Light grey background */
            display: flex; /* Use flexbox for centering */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            min-height: 100vh; /* Full viewport height */
            margin: 0; /* Remove default body margin */
        }

        /* Container for the calculator */
        .calculator-container {
            background-color: #ffffff; /* White background */
            padding: 30px;
            border-radius: 8px; /* Rounded corners */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            text-align: center;
            border: 1px solid #ddd;
            display: inline-block; /* Make the container only as wide as needed */
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        h2 {
            color: #555;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee; /* Separator line */
            padding-bottom: 10px;
        }

        /* Styling for input fields */
        input[type="number"] {
            margin: 8px 5px; /* More vertical margin */
            padding: 10px; /* Larger padding */
            border: 1px solid #ccc; /* Light border */
            border-radius: 4px; /* Slightly rounded corners */
            width: 150px; /* Fixed width */
            font-size: 1em; /* Standard font size */
        }

        /* Styling for all buttons */
        button {
            padding: 10px 15px; /* Larger buttons */
            margin: 5px; /* Spacing between buttons */
            font-size: 1em; /* Standard font size */
            border: none; /* No default border */
            border-radius: 4px; /* Rounded corners */
            background-color: #007bff; /* Blue background */
            color: white; /* White text */
            cursor: pointer; /* Pointer cursor on hover */
            transition: background-color 0.2s ease; /* Smooth hover transition */
        }

        /* Hover effect for buttons */
        button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }

        /* Styling for the result display area */
        .result {
            margin-top: 20px; /* More space above result */
            padding: 15px;
            font-weight: bold;
            font-size: 1.1em; /* Slightly larger font */
            min-height: 25px; /* Ensure space even when empty */
            border-radius: 4px;
            background-color: #e9ecef; /* Light background for the result area */
            border: 1px solid #ced4da;
            word-wrap: break-word; /* Wrap long error messages */
        }

        /* Specific style for error messages */
        .result.error {
            color: #dc3545; /* Red color for errors */
            background-color: #f8d7da; /* Light red background for errors */
            border-color: #f5c6cb;
        }

        /* Specific style for success messages */
        .result.success {
            color: #28a745; /* Green color for success */
            background-color: #d4edda; /* Light green background */
            border-color: #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="calculator-container"> <h1>Welcome to the Calculator</h1>

        <div class="calculator">
            <h2>Calculator</h2>

            <input type="number" id="a" placeholder="First number (a)">
            <input type="number" id="b" placeholder="Second number (b)"><br>

            <button onclick="calculate('add')">Add (+)</button>
            <button onclick="calculate('subtract')">Subtract (-)</button>
            <button onclick="calculate('multiply')">Multiply (*)</button>
            <button onclick="calculate('divide')">Divide (/)</button>

            <button onclick="calculate('power')">Power (a^b)</button>
            <button onclick="calculate('modulo')">Modulo (a%b)</button>
            <div class="result" id="result">Enter numbers and select an operation</div> </div>
    </div> <script>
        async function calculate(operation) {
            const a = parseFloat(document.getElementById('a').value);
            const b = parseFloat(document.getElementById('b').value);
            const resultElement = document.getElementById('result');

            // Reset result styles
            resultElement.className = 'result'; // Remove previous success/error classes

            if (isNaN(a) || isNaN(b)) {
                resultElement.innerText = 'Error: Please enter valid numbers in both fields.';
                resultElement.classList.add('error'); // Add error styling
                return;
            }

            try {
                const response = await fetch('/' + operation, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ a: a, b: b })
                    // Note: FastAPI expects 'a' and 'b' keys in the JSON body based on Pydantic model
                });

                const data = await response.json();

                console.log('Response Status:', response.status);
                console.log('Response Data:', data);

                if (response.ok) {
                    /*
                        Successful Response (Status 200-299)
                        - Displays the 'result' from the JSON data.
                    */
                    resultElement.innerText = 'Result: ' + data.result;
                    resultElement.classList.add('success'); // Add success styling
                } else {
                    /*
                        Error Response (Status 4xx or 5xx)
                        - Displays the 'error' message from the JSON data.
                        - FastAPI usually returns errors in a 'detail' field, adjust if needed.
                    */
                    // Adjust key based on your FastAPI error response structure (e.g., data.detail)
                    const errorMessage = data.error || data.detail || 'Unknown error occurred on the server.';
                    resultElement.innerText = 'Error: ' + errorMessage;
                    resultElement.classList.add('error'); // Add error styling
                }
            } catch (error) {
                /*
                    Catch Block: Handles network errors or issues during the fetch operation.
                */
                console.error('Fetch error:', error);
                resultElement.innerText = 'Network Error: Could not connect or process request. ' + error.message;
                resultElement.classList.add('error'); // Add error styling
            }
        }
    </script>
</body>
</html>
